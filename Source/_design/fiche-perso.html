<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dossier — Transhumains</title>
<style>
/* ============================================================================
   MAQUETTE — fiche de personnage (Personnages), style Signal, un seul écran.
   Grammaire identique à crise-table.html (gelée Q47) : EXPAND = section qui se
   déplie sur place ; POPUP = HUD transitoire (seule la fenêtre « changer de
   corps »), plafonnée à 55 % de la hauteur, la fiche reste visible au-dessus.

   Données : transhumains/Personnages/Transhumains - Personnages.md (dump de la
   feuille de calcul, 14 fiches nommées = PJs, Q36). Chaque valeur lisible est
   reprise au mot près (« réflexes câblés », « Pompe adrenaline », « noir »,
   « storm shield ») ; ce qui est absent ou douteux reste champ vide, jamais
   inventé. Corps et Processeur sont un équipement (Q46) : ils se changent.
   Colonnes énergie : où la source donne un coût (« Energie -1 »), il est repris.
   Cohérence crise/fiche : Mars 2 5/5, Golem 2 6/6, Ludo 2 7/3 (mêmes lignes
   que le relevé fait pour la table de crise).
   Jetons Signal : Source/_design/styles.html [data-style=signal].
   ========================================================================== */
:root{
  --fond:#06090f; --surface:#0d1420; --surface-2:#0d1420; --ligne:#3f88bd;
  --texte:#d5e3ee; --texte-2:#7f97ad;
  --accent:#63e0ff; --accent-2:#3d86b4;
  --critique:#ff7867; --alerte:#ffbb55; --outil:#5fdcae;
  --inversion-fond:#dff2ff; --inversion-texte:#061019;
  --rayon:6px; --equerre:10px;
  --trait:1px; --u:8px; --u2:16px; --demi:4px;
  --sans:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --courbe:cubic-bezier(.32,.72,0,1); --t2:220ms;
  --barre-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--fond);color:var(--texte);font:16px/1.5 var(--sans)}
body{background:var(--fond);color:var(--texte);min-height:100vh;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input,textarea{font:inherit;color:inherit}
h1{font-size:15px;font-weight:700;letter-spacing:.02em}
.chiffre{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums}
.micro{font:600 11px/1.45 var(--sans);letter-spacing:.09em;color:var(--texte-2)}
.secondaire{color:var(--texte-2)}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- bandeau + rail des fiches ---------- */
header.barre{position:sticky;top:0;z-index:40;background:rgba(6,9,15,.92);
  backdrop-filter:blur(6px);border-bottom:var(--trait) solid var(--surface-2)}
.barre-h{display:flex;align-items:center;gap:var(--u2);min-height:var(--barre-h);padding:var(--u) var(--u2)}
.rail{display:flex;gap:var(--demi);overflow-x:auto;padding:0 var(--u2) var(--u);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 var(--u2);border-radius:var(--rayon);border:var(--trait) solid var(--ligne);
  background:var(--surface);color:var(--texte-2);font:650 13px/1.1 var(--sans);display:inline-flex;
  align-items:center;white-space:nowrap}
.chip[aria-current=true]{color:var(--inversion-texte);background:var(--accent);border-color:var(--accent);font-weight:700}
.chip:active{border-color:var(--accent);color:var(--accent)}
.chip.legacy{opacity:.55}
.chip.legacy[aria-current=true]{opacity:.85}
.tag{font:700 9px/1 var(--mono);border:var(--trait) solid var(--texte-2);border-radius:999px;
  padding:3px 5px;margin-left:var(--u);color:var(--texte-2)}
.chip[aria-current=true] .tag{border-color:var(--inversion-texte);color:var(--inversion-texte)}
.badge{font:600 10px/1.4 var(--sans);letter-spacing:.06em;border:var(--trait) solid var(--texte-2);
  border-radius:999px;padding:1px var(--u);color:var(--texte-2)}

/* ---------- en-tete dossier : un coup d'oeil, meme replie ---------- */
.entete{padding:var(--u2) var(--u2) var(--u);border-bottom:var(--trait) solid var(--surface-2);position:relative}
.entete::before{content:"";position:absolute;inset:var(--demi);pointer-events:none;
  background:
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat}
.entete .n{font-size:19px;font-weight:700;line-height:1.25}
.entete .alias{color:var(--texte-2);font-weight:500;font-size:14px}
.entete .l2{display:flex;flex-wrap:wrap;gap:var(--u);align-items:baseline;margin-top:2px}
.entete .palier{font:600 11px/1.5 var(--sans);letter-spacing:.06em;border:var(--trait) solid var(--ligne);
  border-radius:999px;padding:0 var(--u);color:var(--texte-2)}
.entete .hist{font-size:13px;color:var(--texte-2);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entete .credo{margin-left:auto;flex:none;font:700 14px/1.2 var(--mono);color:var(--accent)}
.entete .credo i{font:600 10px/1 var(--sans);letter-spacing:.05em;color:var(--texte-2);font-style:normal;margin-right:3px}

/* ---------- sections : ca se plie et se deplie sur place ---------- */
main{padding:0 var(--u2)}
.sec{border-bottom:var(--trait) solid var(--surface-2)}
.sec-tope{width:100%;display:flex;align-items:center;gap:var(--u);min-height:56px;padding:var(--u) 0;text-align:left}
.chevron{flex:none;width:22px;text-align:center;color:var(--texte-2);font-size:13px}
.sec[data-ouvert=true] .chevron{color:var(--accent)}
.sec-t{flex:1;min-width:0;font:650 14px/1.3 var(--sans);letter-spacing:.03em}
.sec-r{flex:none;max-width:52%;font:600 12px/1.35 var(--mono);color:var(--texte-2);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-corps{position:relative;padding:0 0 var(--u2)}
.sec-corps::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--rayon);
  background:
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat}

/* ---------- champs ---------- */
.ch-gr{display:grid;grid-template-columns:1fr 1fr;gap:var(--u) var(--u2);margin-bottom:var(--u)}
.ch-f{display:flex;flex-direction:column;gap:2px;min-width:0}
.ch-f label{font:600 10px/1.3 var(--sans);letter-spacing:.07em;color:var(--texte-2)}
.ch-f input,.ch-f select{width:100%;min-height:44px;background:var(--surface);border:var(--trait) solid var(--ligne);
  border-radius:var(--rayon);color:var(--texte);font:600 15px/1.2 var(--sans);padding:0 var(--u)}
.ch-f input.num{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums}
.ch-f input::-webkit-outer-spin-button,.ch-f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ch-f input[type=number]{appearance:textfield;-moz-appearance:textfield}

/* ---------- corps actuel : chassis + energie ---------- */
.kv{display:flex;align-items:center;gap:var(--u);min-height:48px;border-bottom:var(--trait) dashed var(--surface-2)}
.kv .k{flex:1;min-width:0;font-size:14px;font-weight:600}
.kv .k .d{display:block;font:400 11.5px/1.35 var(--sans);color:var(--texte-2)}
.kv .v{font:700 16px/1 var(--mono);color:var(--accent);flex:none;min-width:34px;text-align:right}
.kv .v.vide{color:var(--texte-2);font-weight:400}
.kv .e{flex:none;font:600 11px/1.3 var(--mono);color:var(--alerte);min-width:52px;text-align:right}
.stp{display:flex;align-items:center;gap:var(--demi);flex:none}
.stp .v{min-width:44px;height:44px;border-radius:var(--rayon);border:var(--trait) solid var(--surface-2);
  background:var(--surface);display:grid;place-items:center;font:700 17px/1 var(--mono);color:var(--accent)}
.stp .v.vide{color:var(--texte-2)}
.step{width:44px;height:44px;border-radius:var(--rayon);border:var(--trait) solid var(--ligne);
  background:var(--surface);color:var(--texte);font:700 20px/1 var(--mono);flex:none}
.step:active{background:var(--surface-2)}
.step:disabled{opacity:.35}
.bande{min-height:56px;width:100%;border-radius:var(--rayon);border:var(--trait) solid var(--accent);
  background:var(--surface);color:var(--accent);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--u2);padding:0 var(--u2);margin-top:var(--u2)}
.bande:active{background:var(--surface-2)}
.bande .droite{font:600 11px/1.35 var(--sans);color:var(--texte-2);text-align:right;max-width:47%}
.bande:disabled{opacity:.45}

/* ---------- etat de crise ---------- */
.pools{display:grid;grid-template-columns:1fr 1fr;gap:var(--u)}
.pool{min-height:82px;border-radius:var(--rayon);background:var(--surface);border:var(--trait) solid var(--surface-2);
  padding:var(--u) var(--u2);display:flex;flex-direction:column;gap:var(--demi)}
.pool .k{font:600 10px/1 var(--sans);letter-spacing:.06em;color:var(--texte-2)}
.pool .v{font:700 26px/1.1 var(--mono);color:var(--accent)}
.pool .v .x{font-size:12px;color:var(--texte-2)}
.pool .adj{display:flex;gap:var(--demi);margin-top:auto}
.pool .adj .step{width:44px;height:44px}
/* blessures — silhouette + rangee de boutons. Composant en copie partagee avec
   fiche-perso.html ; a factoriser en module dans l'app reelle. Les zones du
   corps ne sont pas des cibles tactiles ; l'edition reste sur les boutons. */
.bles-pan{padding:var(--u) 0 0;text-align:center}
.sil-wrap{position:relative;display:inline-block;background:var(--surface);
  border:var(--trait) solid var(--surface-2);border-radius:var(--rayon);padding:calc(var(--u2) - 2px) var(--u2)}
.sil-wrap::before{content:"";position:absolute;inset:3px;pointer-events:none;
  background:
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) var(--equerre) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 0 calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) calc(100% - var(--equerre)) 100%/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--ligne),var(--ligne)) 100% calc(100% - var(--equerre))/var(--trait) var(--equerre) no-repeat}
.sil{display:block}
/* l'attribut hidden doit gagner contre toute regle display d'etat */
[hidden]{display:none !important}
.sil .zone rect:not(.flash),.sil .zone circle:not(.flash){stroke:var(--ligne);stroke-width:1.5;fill:var(--outil);fill-opacity:.18}
.sil .zone[data-sv="1"] rect:not(.flash),.sil .zone[data-sv="1"] circle:not(.flash){fill-opacity:.35}
.sil .zone[data-sv="2"] rect:not(.flash),.sil .zone[data-sv="2"] circle:not(.flash){fill:var(--alerte);fill-opacity:.6}
.sil .zone[data-sv="3"] rect:not(.flash),.sil .zone[data-sv="3"] circle:not(.flash){fill:var(--critique);fill-opacity:.85}
.sil .val{fill:var(--inversion-texte);font:700 11px var(--mono);text-anchor:middle;display:none}
.sil .zone:not([data-sv="0"]) .val{display:block}
.sil .flash{fill:var(--accent);stroke:none;opacity:0}
.sil .zone.puls .flash{animation:eclair .3s ease-out}
@keyframes eclair{from{opacity:.6}to{opacity:0}}
.zbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--demi);margin-top:var(--u);text-align:left}
button.zb{min-height:44px;border:var(--trait) solid var(--ligne);border-radius:var(--rayon);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
button.zb:active{background:var(--surface-2)}
.zb .zn{font:600 10px/1.2 var(--sans);letter-spacing:.04em;color:var(--texte-2)}
.zb .zc{font:700 16px/1 var(--mono);color:var(--texte)}
.zb[data-sv="2"] .zc{color:var(--alerte)}
.zb[data-sv="3"] .zc{color:var(--critique)}
.zb.remettre{grid-column:1/-1;border-style:dashed;color:var(--texte-2);font:700 13px/1 var(--sans)}

/* ---------- reseau ---------- */
.interrupteur{min-height:44px;min-width:132px;border-radius:var(--rayon);border:var(--trait) solid var(--accent);
  background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;gap:var(--u);
  padding:0 var(--u);font:650 12px/1 var(--sans)}
.interrupteur .led{width:34px;height:18px;border-radius:999px;background:var(--accent);position:relative;flex:none}
.interrupteur .led::after{content:"";position:absolute;top:2px;left:18px;width:14px;height:14px;
  border-radius:50%;background:var(--inversion-texte)}
.interrupteur[data-on=false]{border-color:var(--ligne);color:var(--texte-2)}
.interrupteur[data-on=false] .led{background:var(--surface-2);box-shadow:inset 0 0 0 var(--trait) var(--ligne)}
.interrupteur[data-on=false] .led::after{left:2px;background:var(--texte-2)}

/* ---------- notes ---------- */
textarea.notes{width:100%;min-height:132px;background:var(--surface);border:var(--trait) solid var(--ligne);
  border-radius:var(--rayon);color:var(--texte);font:400 14px/1.55 var(--sans);padding:var(--u) var(--u2);resize:vertical}

/* ---------- liste editable ---------- */
.aj{width:100%;min-height:44px;border:var(--trait) dashed var(--ligne);border-radius:var(--rayon);
  color:var(--texte);font-weight:600;font-size:13px;margin-top:var(--u)}
.aj:active{border-color:var(--accent);color:var(--accent)}
.lig{display:flex;align-items:center;gap:var(--demi);min-height:48px;border-bottom:var(--trait) dashed var(--surface-2)}
.lig input.txt{flex:1;min-width:0;background:transparent;border:var(--trait) solid transparent;border-radius:var(--rayon);
  color:var(--texte);font:500 13.5px/1.3 var(--sans);padding:var(--demi) var(--u);min-height:44px}
.lig input.txt:focus{border-color:var(--ligne);background:var(--surface)}
.lig .sup{width:44px;height:44px;flex:none;color:var(--texte-2);font-size:16px;display:grid;place-items:center;border-radius:var(--rayon)}
.lig .sup:active{color:var(--critique)}

/* ---------- pop-up « changer de corps » : seule couche transitoire ---------- */
#popups{position:fixed;inset:0;z-index:60;pointer-events:none}
.pop{position:absolute;left:0;right:0;bottom:0;max-height:min(55vh,464px);margin:0 auto;max-width:560px;
  pointer-events:auto;display:flex;flex-direction:column;background:var(--fond);
  border:var(--trait) solid var(--ligne);border-bottom:0;border-radius:calc(var(--rayon) * 1.6) calc(var(--rayon) * 1.6) 0 0;
  box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(103%);transition:transform var(--t2) var(--courbe)}
.pop[data-pos=true]{transform:translateY(0)}
.pop::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:calc(var(--rayon) * 1.6) calc(var(--rayon) * 1.6) 0 0;
  background:
   linear-gradient(var(--accent),var(--accent)) var(--equerre) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--accent),var(--accent)) 0 var(--equerre)/var(--trait) var(--equerre) no-repeat,
   linear-gradient(var(--accent),var(--accent)) calc(100% - var(--equerre)) 0/var(--equerre) var(--trait) no-repeat,
   linear-gradient(var(--accent),var(--accent)) 100% var(--equerre)/var(--trait) var(--equerre) no-repeat}
.pop-tete{flex:none;display:flex;align-items:center;gap:var(--u);padding:var(--u) var(--u2);
  border-bottom:var(--trait) solid var(--surface-2)}
.pop-tete h2{font-size:15px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{margin-left:auto;flex:none;width:44px;height:44px;border-radius:999px;background:var(--surface);
  color:var(--texte);font-size:16px;display:grid;place-items:center}
.pop-corps{flex:1;overflow:auto;padding:var(--u) var(--u2) calc(var(--u2) + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.chassis{border:var(--trait) solid var(--ligne);border-radius:var(--rayon);background:var(--surface);
  padding:var(--u) var(--u2);margin-top:var(--u)}
.chassis[data-en-place=true]{border-color:var(--accent)}
.chassis .t{display:flex;align-items:center;gap:var(--u);min-height:44px}
.chassis .t input.nom{flex:1;min-width:0;background:transparent;border:0;border-bottom:var(--trait) dashed var(--surface-2);
  color:var(--texte);font:650 14px/1.3 var(--sans);padding:0 var(--demi);min-height:44px}
.chassis .t .marq{flex:none;font:600 10px/1 var(--sans);letter-spacing:.06em;color:var(--accent)}
.chassis .d{display:flex;align-items:center;gap:var(--u2);flex-wrap:wrap;padding:var(--demi) 0}
.chassis .d .f{display:flex;align-items:center;gap:var(--demi)}
.chassis .d .f label{font:600 10px/1 var(--sans);letter-spacing:.06em;color:var(--texte-2)}
.chassis .d .f input{width:64px;min-height:44px;background:var(--fond);border:var(--trait) solid var(--ligne);
  border-radius:var(--rayon);color:var(--accent);font:700 16px/1 var(--mono);text-align:center;padding:0;
  appearance:textfield;-moz-appearance:textfield}
.chassis .d .f input::-webkit-outer-spin-button,.chassis .d .f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chassis .prendre{min-height:44px;width:100%;border-radius:var(--rayon);border:var(--trait) solid var(--accent);
  background:transparent;color:var(--accent);font-weight:700;font-size:14px;margin-top:var(--demi)}
.chassis .prendre:active{background:var(--surface-2)}
.chassis .prendre:disabled{opacity:.4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>
</head>
<body>
<header class="barre">
  <div class="barre-h"><h1>Dossier</h1></div>
  <div class="rail" id="rail" role="tablist" aria-label="Fiches"></div>
</header>
<main id="plan"></main>
<div id="popups"></div>
<script>
(function(){
'use strict';
/* ---- modèle ----
   Chaque valeur vient de Personnages.md, transcrite au mot près.
   null = case vide ou douteuse de la source — jamais inventée.
   « niv: null » dans une compétence = la source ne permet pas de trancher
   entre niveau et coût xp ; le champ reste libre. */
var PALIERS=['','Adolescent','Etudiant','Adulte','Veteran'];

function silhouetteBles(ZONES,getter,setter){

   +'<g class="zone" data-z="Tête" data-sv="0"><circle cx="75" cy="22" r="13"/><circle class="flash" cx="75" cy="22" r="13"/><text class="val" x="75" y="26">0</text></g>'
   +'<g class="zone" data-z="Poitrine" data-sv="0"><rect x="57" y="39" width="36" height="29" rx="3"/><rect class="flash" x="57" y="39" width="36" height="29" rx="3"/><text class="val" x="75" y="57">0</text></g>'
   +'<g class="zone" data-z="Bras droit" data-sv="0"><rect x="37" y="41" width="16" height="55" rx="3"/><rect class="flash" x="37" y="41" width="16" height="55" rx="3"/><text class="val" x="45" y="72">0</text></g>'
   +'<g class="zone" data-z="Bras gauche" data-sv="0"><rect x="97" y="41" width="16" height="55" rx="3"/><rect class="flash" x="97" y="41" width="16" height="55" rx="3"/><text class="val" x="105" y="72">0</text></g>'
   +'<g class="zone" data-z="Abdomen" data-sv="0"><rect x="57" y="70" width="36" height="27" rx="3"/><rect class="flash" x="57" y="70" width="36" height="27" rx="3"/><text class="val" x="75" y="87">0</text></g>'
   +'<g class="zone" data-z="Jambes" data-sv="0"><rect x="57" y="99" width="36" height="57" rx="3"/><rect class="flash" x="57" y="99" width="36" height="57" rx="3"/><text class="val" x="75" y="131">0</text></g>'
   +'</svg>';
  w.appendChild(sil);
  var zoneEls={},zcEls={},zbEls={};
  function sev(n){return n===0?0:(n<=2?1:(n<=4?2:3))}
  function sync(){
    ZONES.forEach(function(z){
      var n=Math.max(0,Math.min(9,getter(z)||0)),sv=sev(n);
      zoneEls[z].setAttribute('data-sv',String(sv));

  var zb=el('div','zbtns');

    zbEls[z]=b;zcEls[z]=v;
    zb.appendChild(b);
  });
  var rm=el('button','zb remettre','remettre');rm.type='button';
  rm.addEventListener('click',function(){setter(null,null);sync()});
  zb.appendChild(rm);
  w.appendChild(zb);
  Array.prototype.forEach.call(sil.querySelectorAll('.zone'),function(g){zoneEls[g.getAttribute('data-z')]=g});

  function ligneChassis(nomValeur,cValeur,pValeur,enPlace,ecr){
    var card=el('div','chassis');
    if(enPlace)card.setAttribute('data-en-place','true');
    var th=el('div','t');
    var i=document.createElement('input');i.type='text';i.className='nom';i.value=nomValeur==null?'':nomValeur;
    i.placeholder='nom du ch\u00e2ssis';i.setAttribute('aria-label','nom du ch\u00e2ssis');
    i.addEventListener('change',function(){ecr.nom=i.value.trim()});
    th.appendChild(i);
    if(enPlace)th.appendChild(el('span','marq','EN PLACE'));
    card.appendChild(th);
    var d=el('div','d');
    [['CORPS','c'],['PROCESSEUR','p']].forEach(function(cc){
      var f=el('div','f');var l=el('label',null,cc[0]);
      var n=document.createElement('input');n.type='number';n.min='1';n.max='20';n.inputMode='numeric';
      if(cc[1]==='c'?cValeur!=null:pValeur!=null)n.value=String(cc[1]==='c'?cValeur:pValeur);
      n.placeholder='\u2014';l.setAttribute('for',n.id='i'+Math.random().toString(36).slice(2,8));
      n.addEventListener('change',function(){
        ecr[cc[1]]=(n.value===''||isNaN(+n.value))?null:Math.max(1,Math.min(20,Math.round(+n.value)))});
      f.appendChild(l);f.appendChild(n);d.appendChild(f)});
    card.appendChild(d);
    if(!enPlace){
      var b=el('button','prendre','prendre ce corps');b.type='button';
      b.addEventListener('click',function(){
        s.vivier[ecr._k]={nom:ecr.nom,c:ecr.c,p:ecr.p};
        var v=s.vivier[ecr._k];
        if(v.c!==null&&v.c!==undefined)s.car.corps=v.c;
        if(v.p!==null&&v.p!==undefined)s.car.proc=v.p;
        s.pool.corps=s.car.corps;s.pool.proc=s.car.proc;
        s.chassis=v.nom&&v.nom!==''?v.nom:s.chassis;
        sauver();fermerPop();rendre();
      });
      card.appendChild(b);
    }
    return card;
  }
  c.appendChild(ligneChassis(s.chassis,s.car.corps,s.car.proc,true,{nom:s.chassis,c:s.car.corps,p:s.car.proc}));
  c.appendChild(el('p','micro secondaire','vivier'));
  s.vivier.forEach(function(v,k){
    var ecr={nom:v.nom,c:v.c,p:v.p,_k:k};
    c.appendChild(ligneChassis(v.nom,v.c,v.p,false,ecr));
  });
  var add=el('button','aj','+ corps');add.type='button';
  add.addEventListener('click',function(){s.vivier.push({nom:'',c:null,p:null});sauver();fermerPop();popupCorps()});
  c.appendChild(add);
  pop.appendChild(c);
  ouvrirPop(pop);
}

window.__fiche={etat:function(){return{sheets:sheets,actif:actif}},sauver:sauver,rendre:rendre};
