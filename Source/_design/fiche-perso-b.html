<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fiche — Transhumains</title>
<style>
:root{
  --fond:#06090f; --surf:#0d1420; --surf2:#0b1220;
  --ligne:#3f88bd; --linha:rgba(63,136,189,.42); --ligne3:rgba(63,136,189,.16);
  --texte:#d5e3ee; --texte2:#7f97ad;
  --accent:#63e0ff; --accA:rgba(99,224,255,.14);
  --alert:#ffbb55; --alertA:rgba(255,187,85,.5); --crit:#ff7867; --ok:#5fdcae;
  --inv:#06090f;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
  --sans:"Bahnschrift","Helvetica Neue",Verdana,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:
    radial-gradient(900px 420px at 110% -6%, rgba(63,136,189,.07), transparent 62%),
    radial-gradient(700px 380px at -8% 108%, rgba(99,224,255,.05), transparent 60%),
    var(--fond);
  color:var(--texte); font-family:var(--sans); font-size:13.5px; line-height:1.38;
  min-height:100svh; -webkit-text-size-adjust:100%;
}
[hidden]{display:none !important}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.equerre{
  background-color:var(--surf);
  background-image:
    linear-gradient(var(--ligne) 0 0), linear-gradient(var(--ligne) 0 0),
    linear-gradient(var(--ligne) 0 0), linear-gradient(var(--ligne) 0 0),
    linear-gradient(var(--ligne) 0 0), linear-gradient(var(--ligne) 0 0),
    linear-gradient(var(--ligne) 0 0), linear-gradient(var(--ligne) 0 0);
  background-position:0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
  background-size:14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px;
  background-repeat:no-repeat;
}
#rail{position:sticky; top:0; z-index:6; display:flex; gap:8px; overflow-x:auto;
  padding:10px 12px 8px; scrollbar-width:none;
  background:linear-gradient(180deg, var(--fond) 86%, rgba(6,9,15,0));}
#rail::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto; min-width:66px; min-height:48px; padding:7px 9px 6px; text-align:left;
  border:1px solid var(--ligne3); border-radius:var(--r); background:var(--surf);
  color:var(--texte); font-family:var(--mono); font-size:10.5px; line-height:1.2;
  display:flex; flex-direction:column; justify-content:space-between; gap:3px; cursor:pointer}
.rchip b{font-weight:600; max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rchip .tag{font-size:8.5px; color:var(--texte2); letter-spacing:.06em; font-style:normal}
.rchip.cur{border-color:var(--accent); background:var(--surf2); color:#bfeaff; box-shadow:0 0 0 1px var(--accA)}
.rchip.cur .tag{color:var(--accent)}
.rchip .tag.og{color:var(--alert)}
#hero{margin:10px 12px 12px; border:1px solid var(--ligne3); border-radius:var(--r); padding:12px 12px 10px}
.hname{display:flex; align-items:center; gap:10px; min-height:44px}
.hname .nom{font-family:var(--mono); font-size:24px; font-weight:700; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.hname .vers{font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:999px;
  border:1px solid var(--ligne3); color:var(--texte2); flex:0 0 auto}
.hname .vers.v2{color:var(--accent); border-color:rgba(99,224,255,.45)}
.hname .vers.og{color:var(--alert); border-color:var(--alertA)}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-top:6px}
.tile{min-height:64px; border:1px solid var(--ligne3); border-radius:var(--r); padding:7px 8px 5px;
  display:flex; flex-direction:column; justify-content:space-between; gap:2px;
  background:linear-gradient(180deg, rgba(63,136,189,.10), rgba(63,136,189,.02) 72%)}
.tile .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; color:var(--texte2)}
.tile.tr{border-color:rgba(99,224,255,.4)}
.tile .v{font-family:var(--mono); font-size:23px; font-weight:700; font-variant-numeric:tabular-nums}
.mets{display:flex; align-items:center; gap:8px; margin-top:8px; min-height:44px}
.mets .m{font-family:var(--mono); font-size:12px; color:var(--texte);
  border-radius:var(--r); padding:6px 2px; display:inline-flex; align-items:center; font-variant-numeric:tabular-nums}
.mini{font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; min-height:44px; padding:6px 12px;
  margin-left:auto; border:1px solid var(--accent); border-radius:var(--r); color:var(--accent);
  background:var(--accA); cursor:pointer}
.bloc{border-top:1px solid var(--ligne3)}
.bh{display:flex; align-items:center; gap:10px; width:100%; min-height:52px; padding:0 12px;
  background:none; border:0; cursor:pointer; text-align:left; color:inherit}
.bh .bt{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--texte2); flex:0 0 auto}
.bh .bs{flex:1; min-width:0; font-family:var(--mono); font-size:12px; color:var(--texte);
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right}
.bh .ch{flex:0 0 auto; font-family:var(--mono); font-size:10px; color:var(--texte2); transition:transform .18s}
.bloc.on .ch{transform:rotate(180deg)}
.bc{padding:2px 12px 16px}
.card{border:1px solid var(--ligne3); border-radius:var(--r); padding:10px 10px 8px}
.cvr{display:flex; align-items:center; gap:10px; min-height:44px}
.cvr .vn{font-family:var(--mono); font-size:16px; font-weight:700; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn{font-family:var(--mono); font-size:11px; letter-spacing:.04em; min-height:44px; padding:6px 11px;
  border:1px solid var(--ligne); border-radius:var(--r); background:none; color:var(--texte); cursor:pointer}
.btn.acc{border-color:var(--accent); color:var(--accent); background:var(--accA)}
.vmeta{display:flex; flex-wrap:wrap; gap:4px 14px; font-family:var(--mono); font-size:12px; color:var(--texte2);
  padding:8px 2px 2px; min-height:44px; align-items:center; font-variant-numeric:tabular-nums}
.vmeta b{color:var(--texte); font-weight:600}
.mods{display:flex; flex-direction:column}
.mod{display:flex; align-items:center; gap:8px; width:100%; min-height:48px; padding:4px;
  border:0; border-top:1px solid var(--ligne3); background:none; color:inherit; cursor:pointer; text-align:left}
.mod .mn{flex:1; min-width:0; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mod .mi,.mod .me,.mod .mp{font-family:var(--mono); font-size:10.5px; color:var(--texte2);
  border:1px solid var(--ligne3); border-radius:4px; padding:2px 6px; flex:0 0 auto;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.mod .mi{color:var(--accent); border-color:rgba(99,224,255,.35)}
.mod .me{color:var(--alert); border-color:rgba(255,187,85,.3)}
.mod.acti .mn{color:var(--accent)}
.mod.acti:after{content:"a"; color:var(--accent); font-family:var(--mono); font-size:9px; flex:0 0 auto}
.zbeam{display:grid; grid-template-columns:1fr 118px; gap:10px; align-items:start}
.zcolu{display:flex; flex-direction:column; min-width:0}
.zrow{display:flex; align-items:center; gap:4px; min-height:50px; border-top:1px solid var(--ligne3)}
.zrow:first-child{border-top:0}
.zrow .zl{flex:1; min-width:0; background:none; border:0; color:var(--texte2); font-family:var(--mono);
  font-size:10px; letter-spacing:.02em; text-align:left; padding:6px 2px; min-height:44px; cursor:pointer;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.zrow .zc{flex:0 0 44px; width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:15px; font-weight:700; border:1px solid var(--ligne3); border-radius:var(--r);
  background:none; color:var(--texte); font-variant-numeric:tabular-nums; cursor:pointer; padding:0}
.zrow .zb{flex:0 0 44px; width:44px; min-height:44px; margin:0; font-family:var(--mono); font-size:15px;
  border:0; border-radius:var(--r); background:rgba(63,136,189,.12); color:var(--texte2); cursor:pointer; padding:0}
.zrow .zb:active{background:rgba(63,136,189,.24)}
.amb{border-bottom:1px dashed rgba(255,187,85,.55)}
.figcol svg{width:104px; height:218px; display:block; margin:6px auto 0}
.zn{font-family:var(--mono); font-weight:700; font-size:10px}
.crows{display:flex; flex-direction:column; min-width:0}
.crow{display:flex; align-items:baseline; gap:8px; min-height:50px; padding:6px 4px;
  border-top:1px solid var(--ligne3)}
.crow:first-child{border-top:0}
.crow .cn{flex:1; min-width:0; font-size:12.5px}
.crow .cv{flex:0 0 54px; min-height:44px; display:flex; align-items:center; justify-content:flex-end;
  font-family:var(--mono); font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; padding:0 4px}
.crow .cx{flex:0 0 auto; font-family:var(--mono); font-size:10.5px; color:var(--texte2); padding:0 4px;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.dtag{font-family:var(--mono); font-size:9.5px; color:var(--texte2); letter-spacing:.08em; margin:10px 2px 2px; display:block}
.hrow{display:flex; gap:6px; align-items:baseline; min-height:44px; padding:4px 2px;
  border-top:1px solid var(--ligne3)}
.hrow:first-child{border-top:0}
.hrow .hp{flex:0 0 auto; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--texte2)}
.hrow .hx{flex:1; min-width:0; font-size:12.5px; color:var(--texte)}
#vel{position:fixed; inset:0; background:rgba(2,5,10,.62); z-index:30; opacity:0; transition:opacity .2s;
  pointer-events:none}
#vel.on{opacity:1; pointer-events:auto}
#pop{position:fixed; left:0; right:0; bottom:0; z-index:40; border-radius:10px 10px 0 0;
  border:1px solid var(--ligne); border-bottom:0; background:var(--surf);
  transform:translateY(105%); transition:transform .22s cubic-bezier(.2,.7,.2,1);
  max-height:50vh; overflow:auto; overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom)}
#pop.sw{max-height:55vh}
#pop.on{transform:translateY(0)}
.pip{height:30px; display:flex; align-items:center; justify-content:center; cursor:grab}
.pip:before{content:""; width:44px; height:4px; border-radius:2px; background:var(--ligne)}
.pbody{padding:2px 14px 16px}
.ptit{display:flex; align-items:baseline; gap:8px; min-height:44px; padding:2px 0 6px}
.ptit b{font-family:var(--mono); font-size:14px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vrow{display:flex; align-items:center; gap:8px; width:100%; min-height:52px; padding:8px 4px;
  border:0; border-top:1px solid var(--ligne3); background:none; color:inherit; cursor:pointer; text-align:left}
.vrow .vn2{flex:0 0 auto; max-width:40%; font-family:var(--mono); font-size:13px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vrow .vs{font-family:var(--mono); font-size:10px; color:var(--texte2); flex:1; min-width:0; text-align:right;
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vrow .vtag{font-family:var(--mono); font-size:9px; color:var(--accent); border:1px solid rgba(99,224,255,.4);
  border-radius:999px; padding:2px 7px; flex:0 0 auto}
.jrow{display:flex; align-items:center; gap:8px; width:100%; min-height:52px; padding:8px 4px;
  border:0; border-top:1px solid var(--ligne3); background:none; color:inherit; cursor:pointer; text-align:left}
.jrow .jn{flex:1; min-width:0; font-family:var(--mono); font-size:13px}
.jrow .jv{font-family:var(--mono); font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
.dice{display:flex; flex-wrap:wrap; gap:6px; min-height:44px; align-items:center; padding:8px 0}
.dice i{font-family:var(--mono); font-style:normal; font-size:15px; font-weight:700; min-width:34px;
  min-height:34px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--ligne3); border-radius:var(--r); background:var(--surf2);
  font-variant-numeric:tabular-nums}
.dice i.hi{color:var(--accent); border-color:var(--accent)}
.tot{font-family:var(--mono); font-size:12px; color:var(--texte2); min-height:44px; display:flex; align-items:center}
.tot b{color:var(--accent); font-size:20px; margin-left:6px}
.pact{display:flex; gap:10px; padding-top:10px; flex-wrap:wrap}
[data-e]{min-height:44px; display:flex; align-items:center; cursor:text; outline:none}
[data-e][contenteditable="true"]{outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px;
  background:var(--accA); caret-color:var(--accent)}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
}
</style>

function somCap(){
  var f = fiche(), best = null, n = f.comp.length + f.exp.length;
  f.comp.forEach(function(c){
    if (typeof c.v === "number" && (!best || c.v > best[0])) best = [c.v, c.n];
  });
  f.exp.forEach(function(c){
    if (typeof c.v === "number" && (!best || c.v > best[0])) best = [c.v, c.n];

function pathOf(el){ var d = el.getAttribute("data-e"); return d ? d.split(".") : null; }
function setIn(o, pr, v){
  for (var i = 0; i < pr.length - 1; i++){
    if (typeof o[pr[i]] !== "object" || o[pr[i]] === null) o[pr[i]] = {};
    o = o[pr[i]];
  }
  o[pr[pr.length - 1]] = v;
}
var editingEl = null;
function commitEdit(el){
  var pr = pathOf(el); if (!pr) return;
  var t = el.textContent.trim();
  var isNum = el.getAttribute("data-num") === "1";
  if (isNum){
    if (t.slice(0, 2) === "₡ ") t = t.slice(2);
    else if (t.slice(0, 3) === "xp ") t = t.slice(3);
  }
  var v;
  if (t === "…" || t === "—"){
    v = (pr[0] === "sons") ? 0 : null;
  } else if (isNum){
    var n = parseFloat(t.replace(",", "."));
    v = isNaN(n) ? null : n;
  } else v = t;
  if (pr[0] === "sons" && typeof v === "number") v = Math.max(0, Math.min(9, v));
  if (pr[0] === "crow" || pr[0] === "erow"){
    var list = pr[0] === "crow" ? fiche().comp : fiche().exp;
    var rw = list.filter(function(x){ return x.n === pr[1]; })[0];
    if (rw) rw.v = v;
  } else setIn(fiche(), pr, v);
  el.setAttribute("contenteditable", "false");
  el.classList.remove("edit");
  editingEl = null;
  save(); render();
}
function cancelEdit(el){
